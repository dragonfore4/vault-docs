apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: "kafka-uat"
spec:
  externalSecretName: "kafka"
  namespaceSelectors:
  - matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - demo-uat
  refreshTime: "15s"
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: Periodic
    refreshInterval: "15s"
    target:
      name: kafka
    dataFrom:
      - extract:
          key: kgov/uat/kafka
