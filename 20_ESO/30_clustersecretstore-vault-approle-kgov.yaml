apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # server: "https://vault.home.sirasith.net"
      server: "https://dev-ingress-channel.kgov.gtbnonprd.vayuktbcs"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          # roleId: "fff1d9de-0e15-9efe-f3e1-f82a111ac306" # vault read auth/approle/role/kgov-read-role/role-id
          roleId: "f3807113-515d-c6fa-aa60-549fc8a761d6"
          secretRef:
            name: "vault-approle"
            namespace: "external-secrets"
            key: "secret-id"
      caProvider:
        type: ConfigMap
        name: vault-ca
        # Take ca from : "https://dev-ingress-channel.kgov.gtbnonprd.vayuktbcs"
        key: ca.crt
        namespace: external-secrets
